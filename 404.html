<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirect</title>
    <script>
        // Capture the requested path and redirect to index with it as a parameter
        const fullPath = window.location.pathname + window.location.search + window.location.hash;
        const baseUrl = '/stats-viewer/';
        
        // Redirect to index.html with the original path encoded
        window.location.href = baseUrl + '?_redirect=' + encodeURIComponent(fullPath);
    </script>
</head>
<body>
    Redirecting...
</body>
</html>

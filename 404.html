<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirect</title>
    <script>
        // Store the current URL for client-side routing
        const currentUrl = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('redirect', currentUrl);
        
        // Redirect to index.html
        window.location.href = '/stats-viewer/';
    </script>
</head>
<body>
    Redirecting to stats-viewer...
</body>
</html>
